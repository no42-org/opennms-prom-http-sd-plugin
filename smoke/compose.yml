# Smoke stack: Horizon 36.0.5 with the plugin KAR and a stub SD endpoint.
# Build the KAR first: make build
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  sd-stub:
    # nl6-shaped SD response served from smoke/sd. Edit the file to add or drop targets.
    image: python:3-alpine
    working_dir: /srv
    command: ["python", "-m", "http.server", "8000"]
    volumes:
      - ./sd:/srv:ro

  opennms:
    image: opennms/horizon:36.0.5
    depends_on:
      database:
        condition: service_healthy
      sd-stub:
        condition: service_started
    command: ["-s"]
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
    volumes:
      - ../assembly/kar/target/opennms-prometheus-sd-plugin.kar:/opt/opennms/deploy/opennms-prometheus-sd-plugin.kar:ro
    ports:
      - "127.0.0.1:8980:8980"
      - "127.0.0.1:8101:8101"
