#
# ci-standard preview pipeline: every push to main refreshes the rc image and the rolling preview prerelease.
name: preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: v2026.10.8
  MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: go,node,rust

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      commit-range: ${{ format('{0}..{1}', github.event.before, github.sha) }}
  preview:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install mise
        # The installer is pinned by MISE_VERSION and verifies the binary's sha256 before running it.
        run: | # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - run: make setup
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - run: make release-build
      - run: make image
        env:
          IMAGE_TAG: rc
      - if: hashFiles('Dockerfile') != ''
        name: Push and sign rc image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:rc"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:rc")
          cosign sign --yes "$digest"
      - name: Refresh rolling preview prerelease
        # Opt out with the repository variable PREVIEW_RELEASE=false for repos that want no rolling prerelease.
        if: vars.PREVIEW_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(ls -A dist 2>/dev/null)" ] || { echo "no binaries, skipping preview release"; exit 0; }
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview --prerelease --target "$GITHUB_SHA" --title "Preview (main)" --notes "Unstable build from main @ ${GITHUB_SHA:0:7}. Not a supported release."
          find dist -type f -exec gh release upload preview {} +
